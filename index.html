<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elyeska Kitapları</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(rgba(10, 14, 20, 0.65), rgba(8, 12, 16, 0.8)),
                        url('https://images.unsplash.com/photo-1548625361-16eb14fa3f44?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            color: #e6edf3;
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }
        header {
            padding: 2.5rem 1rem 1rem;
            letter-spacing: 3px;
            font-size: 0.9rem;
            text-transform: uppercase;
            width: 100%;
        }
        nav a {
            color: #c4d1db;
            text-decoration: none;
            margin: 0 15px;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            transition: color 0.3s, text-shadow 0.3s;
        }
        nav a:hover {
            color: #dfb76c;
            text-shadow: 0 0 10px rgba(223, 183, 108, 0.5);
        }
        .hero {
            max-width: 850px;
            padding: 2rem 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ornament {
            color: #dfb76c;
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            letter-spacing: 5px;
            opacity: 0.85;
        }
        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 6vw, 4.2rem);
            letter-spacing: 8px;
            color: #f7f9fa;
            text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9), 0 0 15px rgba(223, 183, 108, 0.3);
            margin-bottom: 1.2rem;
            text-transform: uppercase;
        }
        .hero p {
            font-size: clamp(1.2rem, 3.5vw, 1.7rem);
            font-style: italic;
            color: #d1d9e0;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
            border-top: 1px solid rgba(223, 183, 108, 0.3);
            border-bottom: 1px solid rgba(223, 183, 108, 0.3);
            padding: 15px 25px;
            background: rgba(10, 14, 20, 0.35);
            backdrop-filter: blur(4px);
        }
        .btn-enter {
            display: inline-block;
            padding: 14px 36px;
            border: 1px solid #dfb76c;
            color: #dfb76c;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            background: rgba(10, 15, 22, 0.6);
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .btn-enter:hover {
            background: #dfb76c;
            color: #0b0f14;
            box-shadow: 0 0 25px rgba(223, 183, 108, 0.6);
            transform: translateY(-2px);
        }
        footer {
            padding: 2rem 1rem;
            font-size: 0.85rem;
            color: #8b949e;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="#kutuphane">Kütüphane</a>
            <a href="#dunya">Evren</a>
            <a href="#hakkinda">Yazar</a>
            <a href="#mektuplar">İletişim</a>
        </nav>
    </header>

    <main class="hero">
        <div class="ornament">❖ ❖ ❖</div>
        <h1>ELYESKA KİTAPLARI</h1>
        <p>“seni tüm kış boyunca seveceğim ve burada kışlar sonsuzdur.”</p>
        <a href="#kutuphane" class="btn-enter">Kütüphaneye Adım At</a>
    </main>

    <footer>
        &copy; Elyeska. Tüm hakları saklıdır.
    </footer>
</body>
</html>
